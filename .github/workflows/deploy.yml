name: Deploy to production

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4

      - name: Install system dependencies
        run: sudo apt-get install -y libgl1

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: us-east-1

      - name: Install Python dependencies
        run: |
          pip install poetry
          poetry install
        working-directory: backend

      # Migrations run inside the VPC on Api container startup (alembic upgrade head).
      # GitHub-hosted runners cannot reach private RDS.

      - name: Run tests
        run: poetry run pytest tests/unit tests/integration
        working-directory: backend

      - name: Install JS dependencies
        run: npm install -g pnpm && pnpm install
        working-directory: frontend

      - name: Deploy with SST
        run: CI=true npx sst deploy --stage production
